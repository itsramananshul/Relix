[package]
name = "relix-runtime"
description = "Relix runtime: transport (libp2p), SOL VM with RemoteCall, dispatch bridge, capability registry, manifest exchange, node implementations."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
authors.workspace = true

[lints.rust]
unsafe_code = "forbid"

[dependencies]
relix-core.workspace = true

# Async runtime + transport (libp2p inherited from OpenPrem INFRA reuse)
tokio.workspace = true
futures.workspace = true
async-trait.workspace = true
libp2p.workspace = true

# Codec / errors / time / serde
serde.workspace = true
serde_bytes.workspace = true
serde_json.workspace = true
ciborium.workspace = true
thiserror.workspace = true
time.workspace = true
hex.workspace = true
toml.workspace = true
rand.workspace = true
blake3.workspace = true
ed25519-dalek.workspace = true
bytes.workspace = true

# Node implementations (memory / ai / tool / web_bridge are modules of this crate)
rusqlite.workspace = true
reqwest.workspace = true
axum.workspace = true
diffy.workspace = true
lopdf.workspace = true
base64.workspace = true
tower.workspace = true
tower-http.workspace = true
hyper.workspace = true

# Logging
tracing.workspace = true

[features]
# PH-BROWSER-FEATURES — per-backend opt-in flags. Default
# build ships the NoneBackend honest scaffold only.
# Selecting `backend = "<name>"` in `[tool.browser]` requires
# the corresponding feature; otherwise the tool node fails
# loudly at startup (no silent fallback to NoneBackend).
default = []
browser-headless-chrome = []
browser-playwright = []
browser-webdriver = []
# Convenience: turn on all three backend features at once.
browser-all = [
    "browser-headless-chrome",
    "browser-playwright",
    "browser-webdriver",
]

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
