name: CI

# Actions-minute policy (see scripts/ci-local.ps1):
#
# CI does NOT run automatically on push or PR — it is manual-only
# (workflow_dispatch), so no red/green pass-fail status is attached to
# every commit. Run the full gate locally via `scripts/ci-local.ps1`
# before tagging, or trigger this workflow by hand from the Actions tab
# when you want the macOS + Linux coverage a Windows-only dev box cannot
# reproduce (OS-specific code under #[cfg(unix)] / #[cfg(target_os=...)],
# path and line-ending differences).
#
# (release.yml still runs on v* tags.)
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        # Cache is a build-speed optimisation, not a correctness gate; a
        # restore/save failure must never fail an otherwise-green run.
        continue-on-error: true
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # The macOS + Linux workspace test is the coverage a Windows-only local
  # run cannot give. The windows-latest leg is run locally via
  # scripts/ci-local.ps1 (which also covers fmt / clippy / deny).
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        # Cache is a build-speed optimisation, not a correctness gate; a
        # restore/save failure must never fail an otherwise-green run.
        continue-on-error: true
      - run: cargo test --workspace

  # Supply-chain gate (license allowlist + advisories + sources). Reads
  # the lockfile, so it is platform-independent — also available locally
  # via scripts/ci-local.ps1 (`cargo deny check --all-features`).
  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arg: --all-features
