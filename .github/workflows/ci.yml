name: CI

# Actions-minute policy (see scripts/ci-local.ps1):
#
# On push / PR, GitHub runs ONLY the macOS + Linux workspace test — the
# platform coverage a Windows-only local dev box cannot reproduce
# (OS-specific code under #[cfg(unix)] / #[cfg(target_os=...)], path and
# line-ending differences). Everything platform-independent — rustfmt,
# clippy, cargo deny — and the Windows test leg are run locally via
# `scripts/ci-local.ps1` before tagging. Those jobs are KEPT here (not
# deleted) but gated to manual `workflow_dispatch` so they no longer
# burn Actions minutes on every commit.
#
# (release.yml still runs on v* tags; fast-ci.yml / heavy-ci.yml /
# nightly-security.yml are disabled in the Actions UI.)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Platform-independent — run locally via scripts/ci-local.ps1.
  # Manual-only: runs on workflow_dispatch, SKIPPED on push / PR.
  fmt:
    name: rustfmt
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # Platform-independent — run locally via scripts/ci-local.ps1.
  # Manual-only: runs on workflow_dispatch, SKIPPED on push / PR.
  clippy:
    name: clippy
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        # Cache is a build-speed optimisation, not a correctness gate; a
        # restore/save failure must never fail an otherwise-green commit.
        continue-on-error: true
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # KEPT auto-running on push / PR. The macOS + Linux workspace test is
  # the coverage a Windows-only local run cannot give. The
  # windows-latest leg was intentionally dropped — it is run locally via
  # scripts/ci-local.ps1 (which also covers fmt / clippy / deny).
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        # Cache is a build-speed optimisation, not a correctness gate; a
        # restore/save failure must never fail an otherwise-green commit.
        continue-on-error: true
      - run: cargo test --workspace

  # Supply-chain gate (license allowlist + advisories + sources). Reads
  # the lockfile, so it is platform-independent — run locally via
  # scripts/ci-local.ps1 (`cargo deny check --all-features`). Manual-only:
  # runs on workflow_dispatch, SKIPPED on push / PR.
  deny:
    name: cargo deny
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arg: --all-features
