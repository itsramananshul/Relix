name: CI

# Required gate for every push to main and every pull request.
#
# Runs the full hygiene set so no regression can land green:
#   cargo fmt --all -- --check               (formatting)
#   cargo clippy --all-targets -D warnings   (lints, per OS)
#   cargo test --workspace                   (tests, per OS)
#   cargo deny check                         (licenses, bans, sources, advisories)
#   secret / AI-coauthor tag scan            (cheap, catches the worst mistakes)
#
# clippy and test run on the full ubuntu + macOS + windows matrix because
# OS-gated code (#[cfg(unix)], #[cfg(target_os = "...")], path and
# line-ending behaviour) only compiles and lints on its own host, so a
# Linux-only run lets OS-specific regressions land green. fmt and deny read
# host-independent inputs, so they run once on Linux.
#
# Heavier on-demand checks (end-to-end mesh bring-up) live in heavy-ci.yml;
# the scheduled security pass lives in nightly-security.yml. Neither is a
# required PR gate. See docs/ci-strategy.md.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  build-test:
    name: clippy + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        # Cache is a build-speed optimisation, not a correctness gate; a
        # restore or save failure must never fail an otherwise-green run.
        continue-on-error: true
        with:
          shared-key: ci-${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arg: --all-features

  secret-scan:
    name: secret / AI-tag scan
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: grep for committed secrets and AI-coauthor tags
        run: |
          set -e
          # Patterns that should never appear in the tree. Workflow files
          # themselves contain the pattern strings, so they are excluded.
          BAD='sk-proj-|sk-ant-|ANTHROPIC_API_KEY *= *[a-zA-Z]|OPENAI_API_KEY *= *[a-zA-Z]|Co-authored-by:|Generated by AI|generated with AI'
          if grep -rIli \
              --exclude-dir=.git \
              --exclude-dir=target \
              --exclude-dir=reference \
              --exclude-dir=.github \
              -E "$BAD" .; then
            echo "::error::secret or AI-coauthor marker present in tracked files"
            exit 1
          fi
          echo "secret-scan clean"
