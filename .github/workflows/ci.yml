name: CI

# Manual-only trigger. Enable push / pull_request again here when we
# want CI to gate every commit; for now contributors run the same
# gates locally (cargo fmt --all -- --check, cargo clippy --workspace
# --all-targets -- -D warnings, cargo test --workspace) and CI is
# kicked off on demand via the GitHub Actions UI or `gh workflow run
# ci.yml`.
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        # The cache post-step intermittently fails on the Windows
        # runner when target/ is large (tar/zstd compression + cache
        # upload occasionally errors with no diagnostic). Cache is a
        # build-speed optimisation, not a correctness gate, so a
        # cache restore / save failure must never fail CI for an
        # otherwise-green commit.
        continue-on-error: true
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        # See note on the clippy job — cache is a build-speed
        # optimisation, not a correctness gate. Without this, the
        # Windows runner's cache-save post-step (large target/, slow
        # tar pipeline) intermittently fails the job AFTER every
        # test has already passed.
        continue-on-error: true
      - run: cargo test --workspace
