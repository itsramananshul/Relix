name: fast-ci

# Fast feedback for rapid iteration.
# - cargo fmt --check
# - cargo check --workspace
# - cargo test --workspace (unit; integration that needs no network)
# - lightweight secret scan
#
# Target runtime: under 5 minutes with warm cache.
#
# Heavier checks (clippy --all-targets, cargo deny, cargo audit, full
# integration matrix) live in heavy-ci.yml and nightly-security.yml.
# See docs/ci-strategy.md.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Minimal permissions — no check-run, no security-events write needed here.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Speed: warn (not deny) — fast lane should not flap on transient warnings.
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  check:
    name: cargo check --workspace
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: fast-ci
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --workspace --all-targets

  test:
    name: cargo test --workspace
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: fast-ci
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --workspace

  secret-scan:
    name: secret/AI-tag scan
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: grep for committed secrets and AI-coauthor tags
        run: |
          set -e
          # Patterns that should never appear in the tree. Workflow files
          # themselves contain the pattern strings, so they are excluded.
          BAD='sk-proj-|sk-ant-|ANTHROPIC_API_KEY *= *[a-zA-Z]|OPENAI_API_KEY *= *[a-zA-Z]|Co-authored-by:|Generated by AI|generated with AI'
          if grep -rIli \
              --exclude-dir=.git \
              --exclude-dir=target \
              --exclude-dir=reference \
              --exclude-dir=.github \
              -E "$BAD" .; then
            echo "::error::secret or AI-coauthor marker present in tracked files"
            exit 1
          fi
          echo "secret-scan clean"
