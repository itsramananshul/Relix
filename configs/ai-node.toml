# AI node — registers `ai.chat`.
#
# Two providers ship today: `mock` (deterministic; default; no secrets) and
# `anthropic` (real model). Provider selection is here in config; the SOL
# chat flow does NOT change between providers — it always calls
# `ai.chat(session_id|prompt|history)` and gets back UTF-8 text.

[controller]
name = "ai-node"
node_type = "ai"
listen_port = 9002

[identity]
key_path = "dev-keys/ai.key"

[trust]
org_root_key_path = "dev-keys/org-root.pub"

[policy]
file = "configs/policies/ai.toml"

[ai]
# `mock` (default) or `anthropic`.
provider = "mock"

# Provider-specific settings. Only consulted when `provider = "anthropic"`.
[ai.anthropic]
# The API key is loaded from $ANTHROPIC_API_KEY first; if unset, this
# file path is read. The path file must contain the raw key (whitespace
# stripped on read) and MUST be excluded from version control.
api_key_path = "dev-keys/anthropic.key"

# Model + request budget.
model        = "claude-3-5-sonnet-latest"
max_tokens   = 1024
timeout_secs = 60

[peers]
# AI node typically has no outgoing peer needs.
