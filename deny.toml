# cargo-deny configuration. Enforced in CI per CONTRIBUTING.md.
# See https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = false

[licenses]
# Allowed only — explicit list. Adding a new license requires PR review + an
# entry in docs/security-critical-deps.md or docs/dependency-licenses.md
# explaining why the project accepts it.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    # Community Data License Agreement (permissive). Enters the tree via
    # `webpki-roots` (via `reqwest` → `hyper-rustls`). Compatible with the
    # project's Apache-2.0 license and reviewed for distribution implications.
    # Document chain in docs/security-critical-deps.md.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards         = "deny"
deny = []

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked  = "warn"
# Advisory-by-advisory exceptions. Every entry has a matching record in
# docs/security-advisories.md with rationale + review condition. No silent
# suppressions.
ignore = [
    # Transitive via libp2p → libp2p-dns → hickory-resolver → hickory-proto.
    # Alpha M5 demo uses static multiaddrs; no DNS lookups exercised.
    # Review when libp2p ships a fix-bearing release.
    "RUSTSEC-2026-0119",
    # `paste` unmaintained; transitive via libp2p-tcp → if-watch → netlink chain.
    # Macro-only crate; no runtime security impact.
    # Review when if-watch migrates off `paste`.
    "RUSTSEC-2024-0436",
]

[sources]
unknown-registry = "deny"
unknown-git      = "deny"
allow-registry   = ["https://github.com/rust-lang/crates.io-index"]
